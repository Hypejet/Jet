[versions]
# Fat jar compilation
shadow = "8.1.7"

# Nullability
checker-framework-plugin = "0.6.39"
jspecify = "1.0.0"

# Networking
netty = "4.1.110.Final"

# Logging
slf4j = "2.0.13"
logback = "1.5.6"

# Tests
junit-jupiter = "5.10.2"
junit-platform = "1.10.2"

# Configuration
configs = "5.0.1"

# Json serialization
gson = "2.13.1"

# Minecraft-related libraries
adventure = "4.24.0-SNAPSHOT"
jetData = "1.0-SNAPSHOT"
brigadier = "1.0.0-SNAPSHOT"
vanillaGradle = "0.2.1-SNAPSHOT"

# Dependency injection
guice = "7.0.0"

# Utilities
concurrencyUtilities = "1.0"
fastutil = "8.5.15"

# Minecraft
minecraft = "1.21.7"

# Code generation
javapoet = "0.7.0"

# Command line arguments
picocli = "4.7.7"

# Utilities
guava = "33.4.8-jre"

[libraries]
# Networking
netty = { module = "io.netty:netty-all", version.ref = "netty" }

# Nullability
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }

# Minecraft text
adventure = { module = "net.kyori:adventure-api", version.ref = "adventure" }
adventure-minimessage = { module = "net.kyori:adventure-text-minimessage", version.ref = "adventure" }
adventure-serializer-gson = { module = "net.kyori:adventure-text-serializer-gson", version.ref = "adventure" }
adventure-serializer-nbt = { module = "net.kyori:adventure-text-serializer-nbt", version.ref = "adventure" }
adventure-serializer-plain = { module = "net.kyori:adventure-text-serializer-plain", version.ref = "adventure" }

# Logging
slf4j = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

# Tests
junit-jupiter = { module =  "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
junit-platform = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform" }

# Configuration
configs-snakeyaml = { module = "eu.okaeri:okaeri-configs-yaml-snakeyaml", version.ref = "configs" }
configs-serdes-commonds = { module = "eu.okaeri:okaeri-configs-serdes-commons", version.ref = "configs" }

# Json serialization
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }

# Minecraft data
jetDataModelApi = { module = "net.hypejet:jet-data-model-api", version.ref = "jetData" }
jetDataModelServer = { module = "net.hypejet:jet-data-model-server", version.ref = "jetData" }
jetDataCodecs = { module = "net.hypejet:jet-data-codecs", version.ref = "jetData" }
jetDataAutogeneratedApi = { module = "net.hypejet:jet-data-autogenerated-api", version.ref = "jetData" }
jetDataAutogeneratedServer = { module = "net.hypejet:jet-data-autogenerated-server", version.ref = "jetData" }

# Minecraft commands
brigadier = { module = "com.velocitypowered:velocity-brigadier", version.ref = "brigadier" }

# Dependency injection
guice = { module = "com.google.inject:guice", version.ref = "guice" }

# Code generation
javapoet = { module = "com.palantir.javapoet:javapoet", version.ref = "javapoet" }

# Command line arguments
picocli = { module = "info.picocli:picocli", version.ref = "picocli" }

# Utilities
concurrencyUtilities = { module = "net.hypejet:concurrency-utilities", version.ref = "concurrencyUtilities" }
fastutil = { module = "it.unimi.dsi:fastutil", version.ref = "fastutil" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }

[bundles]
# Configuration
configs = ["configs-snakeyaml", "configs-serdes-commonds"]

# Minecraft related libraries
adventure = ["adventure", "adventure-minimessage", "adventure-serializer-gson", "adventure-serializer-nbt",
    "adventure-serializer-plain"]
jetData = ["jetDataModelApi", "jetDataAutogeneratedApi"]
jetDataServer = ["jetDataModelServer", "jetDataCodecs", "jetDataAutogeneratedServer"]

[plugins]
shadow = { id = "io.github.goooler.shadow", version.ref = "shadow" } # Fat jar compilation
checker-framework = { id = "org.checkerframework", version.ref = "checker-framework-plugin" }
vanillaGradle = { id = "org.spongepowered.gradle.vanilla", version.ref = "vanillaGradle" }